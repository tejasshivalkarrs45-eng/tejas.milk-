<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Records</title>

<link rel="stylesheet" href="record.css">
     <script src="record.js" defer></script>



</head>

<body>

<!-- 🔵 HEADER -->
<header class="topbar">
    <h2>SHIVALKAR <span>Natural Dairy Farm</span></h2>
</header>

<!-- 🔵 MAIN CONTAINER -->
<div class="container">

    <!-- 🔍 SEARCH -->
    <input type="text" id="search" placeholder="Search by Name / Mobile">

    <!-- 📊 TABLE -->
    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Name</th>
                <th>Mobile</th>
                <th>Morning</th>
                <th>Evening</th>
                <th>Total Milk</th>
                <th>Amount</th>
                <th>Edit</th>
             
                <th>Continue</th>
                <th>Delete</th>
            </tr>
        </thead>

        <tbody id="tableData">
            <!-- Data yaha API se aayega -->
        </tbody>
    </table>

</div>

<!-- EDIT RECORD FORM -->
<div id="editForm" class="edit-form" style="display:none;">
    <h2>उधारी रिकॉर्ड सुधारें</h2>

    <form id="updateRecordForm">
        <input type="hidden" id="editId">

        <label>नाम</label>
        <input type="text" id="editName" required>

        <label>मोबाइल नंबर</label>
        <input type="tel" id="editMobile" required>

        <label>सुबह का दूध</label>
        <input type="number" id="editMorning" step="0.01" required>

        <label>शाम का दूध</label>
        <input type="number" id="editEvening" step="0.01" required>

        <label>रेट प्रति लीटर</label>
        <input type="number" id="editRate" step="0.01" required>

        <button type="submit">Update Record</button>
        <button type="button" id="cancelEdit">Cancel</button>
    </form>
</div>

<!-- 🔵 HOME LINK -->
<div style="margin-top:20px; text-align:center;">
    <a href="/dashboard/dashboard.html" style="color:red; font-weight:bold;">
        ⬅ Back to Home
    </a>
</div>

</body>
</html>
